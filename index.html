<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stories of the Gods</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<style>
  * { box-sizing:border-box; }
  img { max-width:100%; height:auto; object-fit:contain; }
  body { margin:0; font-family:"Noto Serif Devanagari","Noto Serif",serif; background:#fdf8ec; color:#2b2118; line-height:1.65; }
  .banner { background:#2b2118; color:#f3e9d2; text-align:center; padding:.5rem; font-size:.9rem; }
  header { background:#5b1f24; color:#fff; padding:.9rem 1.2rem; border-bottom:5px solid #c9a227; display:flex; justify-content:space-between; align-items:center; }
  header h1 { margin:0; font-size:1.5rem; }
  .brand { display:flex; align-items:center; gap:.7rem; }
  .logo { width:52px; height:52px; }
  .lang button { font-family:inherit; font-size:.95rem; padding:.4rem 1.1rem; margin:0 .2rem; border-radius:20px; border:1.5px solid rgba(255,255,255,.6); background:transparent; color:#fff; cursor:pointer; }
  .lang button.active { background:#fff; color:#5b1f24; font-weight:700; }
  .tonight { display:flex; flex-direction:column; align-items:center; text-align:center; max-width:960px; margin:0 auto; padding:2rem 1.2rem; }
  .tonight img { max-height:460px; border-radius:10px; border:1px solid #e5d9b8; background:#f3e9d2; }
  .kicker { color:#5b1f24; font-weight:700; }
  .tonight h2 { color:#5b1f24; font-size:1.9rem; margin:.6rem 0 .4rem; }
  .meta { color:#7a6a4f; font-size:.9rem; }
  .btn { display:inline-block; margin-top:.8rem; background:#5b1f24; color:#fff; text-decoration:none; padding:.55rem 1.2rem; border-radius:6px; font-weight:600; }
  .shuffle { font-family:inherit; font-size:.95rem; margin:.8rem 0 0 .5rem; padding:.55rem 1.1rem; border-radius:20px; border:1.5px solid #5b1f24; background:#fff; color:#5b1f24; cursor:pointer; }
  .seclist { max-width:960px; margin:0 auto; padding:0 1.2rem 1.5rem; }
  .seclist h3 { color:#5b1f24; border-bottom:2px solid #c9a227; padding-bottom:.25rem; cursor:pointer; }
  .seclist h3::after { content:" \25BE"; color:#c9a227; }
  .seclist.collapsed h3::after { content:" \25B8"; }
  .seclist.collapsed ul, .seclist.collapsed h4 { display:none; }
  .seclist h4 { color:#5b1f24; margin:1rem 0 .25rem; }
  .cnt { color:#7a6a4f; font-size:.85rem; font-weight:400; }
  ul { list-style:none; padding:0; margin:0; display:flex; gap:1rem; overflow-x:auto; padding-bottom:.75rem; scroll-snap-type:x proximity; }
  li { flex:0 0 300px; scroll-snap-align:start; background:#fffdf6; border:1px solid #e5d9b8; border-radius:10px; padding:.8rem 1rem; }
  li a { color:#5b1f24; text-decoration:none; }
  li a:hover b { text-decoration:underline; }
  li b { display:block; font-size:1.05rem; }
  li .desc { display:block; }
  li .meta { display:block; }
  li.planned { color:#7a6a4f; background:#f7f1e0; }
  li.planned b { color:#7a6a4f; }
  footer { text-align:center; color:#7a6a4f; padding:2rem 1rem 3rem; font-size:.9rem; }
  @media (max-width: 700px) {
    .tonight img { max-height:320px; }
    .tonight #tDesc { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
    header { padding:.7rem .8rem; }
    .brand { gap:.5rem; }
    .logo { width:36px; height:36px; }
    header h1 { font-size:1.05rem; white-space:nowrap; }
    .lang { gap:.3rem; }
    .lang button { padding:.3rem .55rem; font-size:.85rem; }
  }
  @media (max-width: 360px) {
    .logo { width:32px; height:32px; }
    header h1 { font-size:.9rem; }
    .lang button { padding:.25rem .45rem; font-size:.8rem; }
  }
</style></head>
<body>

<header><div class="brand"><img class="logo" src="images/logo-devi-seal.png" alt="देवी"><h1 class="t" id="siteTitle"></h1></div>
<div class="lang"><button class="active" onclick="setLang('hi', this)">हिंदी</button><button onclick="setLang('en', this)">English</button></div></header>
<section class="tonight" id="tonightSec" style="visibility:hidden"><a id="tLink" target="_blank"><img id="tImg" alt=""></a>
<div>
<div class="kicker t" id="tKicker"></div>
<h2 class="t" id="tTitle"></h2>
<p class="t" id="tDesc"></p>
<p class="meta t" id="tMeta"></p>
<a class="btn t" id="tRead" target="_blank"></a>
<button class="shuffle" onclick="shuffleStory()">&#8635; <span class="t" id="tShuffle"></span></button>
</div></section>
<main id="lists"></main>
<footer><p class="t" id="footT"></p></footer>

<script>
var UI = null;
var BOOKS = [];
var curLang = 'hi';
var curIdx = -1;
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function randomIdx() {
  return Math.floor(mulberry32(Date.now())() * BOOKS.length);
}
function tEl(tag, hi, en, cls) {
  var el = document.createElement(tag);
  el.className = cls;
  el.setAttribute('data-hi', hi);
  el.setAttribute('data-en', en);
  el.textContent = curLang === 'hi' ? hi : en;
  return el;
}
function applyLang() {
  document.querySelectorAll('.t').forEach(function(el) {
    var v = el.getAttribute('data-' + curLang);
    if (v !== null) el.textContent = v;
  });
}
function setLang(lang, btn) {
  curLang = lang;
  try { localStorage.setItem('site-lang', lang); } catch (e) {}
  document.querySelectorAll('.lang button').forEach(function(b) { b.classList.toggle('active', b === btn); });
  document.documentElement.lang = lang;
  applyLang();
}
function render(idx) {
  curIdx = idx;
  var b = BOOKS[idx];
  var set = function(id, hi, en) {
    var el = document.getElementById(id);
    el.setAttribute('data-hi', hi);
    el.setAttribute('data-en', en);
    el.textContent = curLang === 'hi' ? hi : en;
  };
  set('tTitle', b.thi, b.ten);
  set('tDesc', b.dhi, b.den);
  set('tMeta', b.mhi, b.men);
  document.getElementById('tImg').src = b.img;
  document.getElementById('tRead').href = b.pdf;
  document.getElementById('tLink').href = b.pdf;
}
function shuffleStory() {
  var idx;
  do { idx = randomIdx(); } while (idx === curIdx);
  render(idx);
}
function renderBook(b) {
  var li = document.createElement('li');
  var title = tEl('b', b.title_hi, b.title_en, 't');
  if (b.status === 'published') {
    var a = document.createElement('a');
    a.href = b.pdf;
    a.target = '_blank';
    a.appendChild(title);
    li.appendChild(a);
  } else {
    li.className = 'planned';
    li.appendChild(title);
  }
  li.appendChild(tEl('span', b.desc_hi, b.desc_en, 'desc t'));
  if (b.status === 'published') {
    li.appendChild(tEl('span', b.meta_hi, b.meta_en, 'meta t'));
  } else {
    li.appendChild(tEl('span', UI.planned.hi, UI.planned.en, 'meta t'));
  }
  return li;
}
function renderLists(sections) {
  var wrap = document.getElementById('lists');
  sections.forEach(function(s) {
    var sec = document.createElement('section');
    sec.className = 'seclist';
    sec.id = 'sec-' + s.id;
    var h3 = document.createElement('h3');
    h3.onclick = function() { toggleSec(h3); };
    h3.onkeydown = function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSec(h3); } };
    h3.tabIndex = 0;
    h3.setAttribute('role', 'button');
    h3.appendChild(tEl('span', s.title_hi, s.title_en, 't'));
    var nreal = s.books.filter(function(b) { return b.status === 'published'; }).length;
    var nplan = s.books.length - nreal;
    var cnt = document.createElement('span');
    cnt.className = 'cnt';
    cnt.textContent = nreal + ' books' + (nplan ? ', ' + nplan + ' planned' : '');
    h3.appendChild(document.createTextNode(' '));
    h3.appendChild(cnt);
    sec.appendChild(h3);
    var plain = s.books.filter(function(b) { return !b.group; });
    if (plain.length) {
      var ul = document.createElement('ul');
      plain.forEach(function(b) { ul.appendChild(renderBook(b)); });
      sec.appendChild(ul);
    }
    var gids = [];
    s.books.forEach(function(b) { if (b.group && gids.indexOf(b.group) === -1) gids.push(b.group); });
    gids.forEach(function(gid) {
      var g = s.groups[gid];
      sec.appendChild(tEl('h4', g.title_hi, g.title_en, 't'));
      var gul = document.createElement('ul');
      s.books.filter(function(b) { return b.group === gid; }).forEach(function(b) { gul.appendChild(renderBook(b)); });
      sec.appendChild(gul);
    });
    wrap.appendChild(sec);
  });
}
function saveCollapsed() {
  var ids = [];
  document.querySelectorAll('.seclist.collapsed').forEach(function(s) { ids.push(s.id); });
  try { localStorage.setItem('collapsed-sections', JSON.stringify(ids)); } catch (e) {}
}
function toggleSec(h) {
  h.parentElement.classList.toggle('collapsed');
  saveCollapsed();
}
function init(data) {
  UI = data.ui;
  var setUi = function(id, v) {
    var el = document.getElementById(id);
    el.setAttribute('data-hi', v.hi);
    el.setAttribute('data-en', v.en);
    el.textContent = curLang === 'hi' ? v.hi : v.en;
  };
  setUi('siteTitle', UI.title);
  setUi('tKicker', UI.kicker);
  setUi('tRead', UI.read);
  setUi('tShuffle', UI.shuffle);
  setUi('footT', UI.footer);
  renderLists(data.sections);
  BOOKS = [];
  data.sections.forEach(function(s) {
    if (s.id === 'archives') return;
    s.books.forEach(function(b) {
      if (b.status === 'published' && b.painting) {
        BOOKS.push({thi: b.title_hi, ten: b.title_en, dhi: b.desc_hi, den: b.desc_en,
                    mhi: b.meta_hi, men: b.meta_en, img: b.painting, pdf: b.pdf});
      }
    });
  });
  try {
    var saved = JSON.parse(localStorage.getItem('collapsed-sections') || '[]');
    saved.forEach(function(id) {
      var s = document.getElementById(id);
      if (s) s.classList.add('collapsed');
    });
  } catch (e) {}
  try {
    var savedLang = localStorage.getItem('site-lang');
    if (savedLang === 'en') {
      curLang = 'en';
      document.documentElement.lang = 'en';
      document.querySelectorAll('.lang button')[0].classList.remove('active');
      document.querySelectorAll('.lang button')[1].classList.add('active');
      applyLang();
    }
  } catch (e) {}
  render(randomIdx());
  document.getElementById('tonightSec').style.visibility = 'visible';
}
if (window.CATALOG_DATA) {
  init(window.CATALOG_DATA);
} else {
  fetch('catalog.json', {cache: 'no-store'}).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(init).catch(function() {
    document.getElementById('tDesc').textContent = 'कैटलॉग लोड नहीं हुआ। Could not load the catalog.';
    document.getElementById('tonightSec').style.visibility = 'visible';
  });
}
</script>
</body></html>
