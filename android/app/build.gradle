android {
    namespace = "com.mahesh.hindustorybooks"
    compileSdk = 34

    // Pin the debug signing key to the keystore copied under the persisted
    // workspace (~/workspace/.tooling/signing/, NOT in this repo — it is a
    // private key). The default debug keystore lives in ephemeral VM storage,
    // so without this the signing SHA-1 silently rotates on every build.
    // Expected SHA-1: 0A:1A:71:63:12:09:A8:1A:7B:69:F7:F0:C2:B6:2A:53:4A:A8:46:CE
    signingConfigs {
        debug {
            storeFile = rootProject.file("../.tooling/signing/debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    defaultConfig {
        applicationId = "com.mahesh.hindustorybooks"
        minSdk = 24
        targetSdk = 34
        versionCode = 5
        versionName = "1.4"
    }

    buildTypes {
        getByName("debug") {
            signingConfig = signingConfigs.getByName("debug")
        }
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("com.google.android.material:material:1.12.0")
    implementation("androidx.recyclerview:recyclerview:1.3.2")
    implementation("androidx.constraintlayout:constraintlayout:2.1.4")
    implementation("androidx.work:work-runtime:2.9.0")
    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.24")
    // androidx.annotation:annotation 1.8.x ships as a Kotlin-multiplatform
    // metadata jar (no classes) and this offline repo carries no .module
    // metadata to redirect it, so the generated ViewBinding sources cannot
    // see androidx.annotation.NonNull. Depend on the JVM artifact directly.
    implementation("androidx.annotation:annotation-jvm:1.8.1")
}

// Old kotlin-stdlib-jdk7/jdk8 artifacts pulled in by androidx cause
// duplicate-class failures with stdlib 1.9.x; exclude them on implementation.
configurations {
    implementation {
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
    }
}
